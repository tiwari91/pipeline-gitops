apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pipeline

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: pipeline-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: tiwari91/pipeline-api:v1.0.0

  - target:
      kind: HorizontalPodAutoscaler
      name: pipeline-api
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 4
