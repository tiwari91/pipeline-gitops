apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pipeline-infra
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: pipeline-gitops
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: postgresql
      namespace: pipeline
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kafka
      namespace: pipeline
  timeout: 10m
