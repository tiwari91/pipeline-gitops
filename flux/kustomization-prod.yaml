apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pipeline-prod
  namespace: flux-system
spec:
  interval: 5m
  path: ./overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: pipeline-gitops
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pipeline-api
      namespace: pipeline
  timeout: 3m
