apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka
  namespace: pipeline
spec:
  interval: 30m
  chart:
    spec:
      chart: kafka
      version: "31.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    fullnameOverride: kafka
    kraft:
      enabled: true
    controller:
      replicaCount: 1
      persistence:
        size: 2Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    broker:
      replicaCount: 0
    provisioning:
      enabled: true
      topics:
        - name: events
          partitions: 3
          replicationFactor: 1
        - name: events-dlq
          partitions: 1
          replicationFactor: 1
    listeners:
      client:
        protocol: PLAINTEXT
      interbroker:
        protocol: PLAINTEXT
      controller:
        protocol: PLAINTEXT
