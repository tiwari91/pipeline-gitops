apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: pipeline
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "16.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    fullnameOverride: postgresql
    auth:
      database: eventpipeline
      username: postgres
      existingSecret: postgresql-secret
      secretKeys:
        adminPasswordKey: postgresql-password
        userPasswordKey: postgresql-password
    primary:
      persistence:
        size: 2Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
